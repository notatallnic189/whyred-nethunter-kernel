name: Build whyred NetHunter kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc flex bison libssl-dev zip

      - name: Build kernel + module + AnyKernel3 zip
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload flashable zip
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: whyred-nethunter-kernel-zip
          path: |
            whyred-nethunter-kernel-*.zip
            whyred-nethunter-kernel-*.zip.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download flashable zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: whyred-nethunter-kernel-zip

      - name: Release on tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            whyred-nethunter-kernel-*.zip
            whyred-nethunter-kernel-*.zip.sha256
